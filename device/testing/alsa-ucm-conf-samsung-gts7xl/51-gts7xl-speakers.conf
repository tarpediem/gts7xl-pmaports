# gts7xl speakers: with S24_LE on the q6asm front end (MultiMedia1) nothing is
# audible (PipeWire's default pick); S16LE plays at the expected level.
# Only the on-board card (platform-sound), not USB or Bluetooth outputs.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = { update-props = { audio.format = "S16LE", audio.rate = 48000 } }
  }
]
