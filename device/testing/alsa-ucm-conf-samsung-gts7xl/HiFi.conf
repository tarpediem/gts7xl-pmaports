Syntax 4

# Four CS35L41 amplifiers on Primary TDM, no DSP firmware (no speaker
# protection). Analog gain 6 = 6.5 dB (range 0.5-20.5 dB) and digital volume
# 0 dB, fixed here: a full-scale stream stays 14 dB under the amplifier's
# maximum gain. Left = top/bottom left amps, right = top/bottom right
# (landscape, as the display is mounted).
# Volume is done in software by PipeWire (no hardware mixer element).

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Top Left Analog PCM Volume' 6"
		cset "name='Top Right Analog PCM Volume' 6"
		cset "name='Bottom Left Analog PCM Volume' 6"
		cset "name='Bottom Right Analog PCM Volume' 6"
		cset "name='Top Left Digital PCM Volume' 817"
		cset "name='Top Right Digital PCM Volume' 817"
		cset "name='Bottom Left Digital PCM Volume' 817"
		cset "name='Bottom Right Digital PCM Volume' 817"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
