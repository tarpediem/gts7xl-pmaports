# device-samsung-gts7xl-sshd-keyonly: SSH login with a key only (the public key
# is put in the user's authorized_keys at install time, pmbootstrap ssh_key_glob).
# Read before 50-postmarketos-ui-policy.conf; for each keyword the first value wins.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
