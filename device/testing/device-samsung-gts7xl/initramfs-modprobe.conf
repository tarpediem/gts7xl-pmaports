# initramfs only: keep udev from autoloading modules still in bring-up;
# 50-gts7xl-modules.sh loads them once the USB debug shell is up.
blacklist stmfts1b
# QCA6390 (Wi-Fi, Bluetooth): the PMU and pwrctrl devices exist at boot and
# would autoload these before the USB debug shell is up.
blacklist pwrseq_qcom_wcn
blacklist pci_pwrctrl_pwrseq
blacklist ath11k_pci
blacklist hci_uart
