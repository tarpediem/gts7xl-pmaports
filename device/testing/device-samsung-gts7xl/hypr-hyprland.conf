# Samsung Galaxy Tab S7+ 5G: device defaults for Hyprland (device-samsung-gts7xl-hyprland).
# Seeded into ~/.config/hypr/hyprland.conf on the first session start (gts7xl-hyprland);
# edit that copy, this file is not read again.

# Panel: 2800x1752 at 120 Hz, DSI command mode. Scale 2 = 1400x876 logical.
monitor = DSI-1, 2800x1752@120, 0x0, 2
monitor = , preferred, auto, 1

env = XCURSOR_SIZE,24

exec-once = waybar
# On-screen keyboard, hidden; the keyboard button of the bar toggles it (SIGRTMIN).
exec-once = wvkbd-mobintl --hidden -L 260
exec-once = swaybg -c 1e1e2e

input {
	# The BT keyboard is QWERTY.
	kb_layout = us
	follow_mouse = 1
	# The touchscreen already reports in the landscape frame (kernel DT swaps/inverts
	# the axes); only bind it to the panel.
	touchdevice {
		output = DSI-1
	}
	touchpad {
		natural_scroll = true
	}
}

general {
	gaps_in = 4
	gaps_out = 8
	border_size = 2
	layout = dwindle
}

decoration {
	rounding = 8
	blur {
		enabled = false
	}
}

animations {
	enabled = true
}

misc {
	disable_hyprland_logo = true
	disable_splash_rendering = true
	# Redraw only on change: the panel is in command mode.
	vfr = true
	# hyprland-guiutils (dialogs) is not packaged in Alpine.
	disable_hyprland_guiutils_check = true
}

# ALT: the owner's BT keyboard has no Super key.
$mod = ALT
bind = $mod, Return, exec, foot
bind = $mod, D, exec, fuzzel
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, K, exec, pkill -RTMIN wvkbd-mobintl
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Brightness (backlight ae94000.dsi.0) and volume (no sound card yet: no-op).
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Power key: screen off/on (gts7xl-powerkey inhibits the touchscreen at the same time).
bindl = , XF86PowerOff, exec, gts7xl-hypr-dpms
